[package]
name = "meshcore-mqtt-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4"
curve25519-dalek = "4.1.3"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hex = "0.4"
indexmap = "2"
percent-encoding = "2.3.2"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rmqtt = { version = "0.24.0", default-features = false, features = ["retain", "ws"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio-tungstenite = "=0.30.0"

[profile.release]
lto = "thin"
strip = true
