[package]
name = "meshcore-mqtt-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2"
hex = "0.4"
rmqtt = { version = "0.24.0", default-features = false, features = ["retain", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
strip = true
