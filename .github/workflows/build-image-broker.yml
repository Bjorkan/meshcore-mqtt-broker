name: Build image for Broker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - postgres/**
      - package.json
      - bun.lock
      - .dockerignore
      - tsconfig.json
      - Dockerfile
      - docker-entrypoint.sh
      - config.yaml
      - compose.yaml.example
      - scripts/**
      - .github/workflows/build-image-broker.yml
      - renovate.json
      - eslint.config.mjs
      - .prettierrc
      - .prettierignore
      - .editorconfig
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check tests for Broker
    runs-on: ubuntu-latest
    timeout-minutes: 3
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17@sha256:567690e00aa9a485b45e2feec09c0e46288ca817891342f5575ba14da6a8592e
        env:
          POSTGRES_DB: meshcore_test
          POSTGRES_USER: meshcore_test
          POSTGRES_PASSWORD: meshcore_test
        options: >-
          --health-cmd "pg_isready -U meshcore_test -d meshcore_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      POSTGRES_TEST_URL: postgresql://meshcore_test:meshcore_test@127.0.0.1:5432/meshcore_test
    # Format/lint failures stop the job immediately – build/test do
    # not run, and dependent jobs (build, publish) are skipped via needs.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting
        run: bun run format:check && bun run lint && bun run typecheck

      - name: Build and run tests
        if: success()
        run: bun run test:postgres

      - name: Validate Compose example
        run: docker compose -f compose.yaml.example config --quiet

  build:
    name: Build image for Broker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build broker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: bjorkan/meshcore-mqtt-broker:build-${{ github.sha }}
          outputs: type=docker,dest=/tmp/broker-image.tar

      - name: Docker Scout broker image
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: archive:///tmp/broker-image.tar
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true
          write-comment: false
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    name: Publish image broker
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'Bjorkan/meshcore-mqtt-broker'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform broker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bjorkan/meshcore-mqtt-broker:latest
            bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}
            ghcr.io/bjorkan/meshcore-mqtt-broker:latest
            ghcr.io/bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}
