name: Build image for Broker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - rust-toolchain.toml
      - .dockerignore
      - Dockerfile
      - config.yaml
      - compose.yaml.example
      - .github/workflows/build-image-broker.yml
      - .github/workflows/ci.yml
      - .github/workflows/dependency-security.yml
      - .github/scripts/container-smoke.sh
      - .github/scripts/container-mqtt-smoke.py
      - .github/fixtures/container-smoke-config.yaml
      - .github/scripts/host-smoke.sh
      - renovate.json
      - .editorconfig
  pull_request:
    paths:
      - src/**
      - tests/**
      - AGENTS.md
      - src/AGENTS.md
      - tests/AGENTS.md
      - .github/AGENTS.md
      - .opencode/**
      - README.md
      - RUST.md
      - SECURITY.md
      - renovate.json
      - .prettierignore
      - .prettierrc
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - rust-toolchain.toml
      - .dockerignore
      - Dockerfile
      - config.yaml
      - compose.yaml.example
      - .github/workflows/build-image-broker.yml
      - .github/workflows/ci.yml
      - .github/workflows/dependency-security.yml
      - .github/scripts/container-smoke.sh
      - .github/scripts/container-mqtt-smoke.py
      - .github/fixtures/container-smoke-config.yaml
      - .github/scripts/host-smoke.sh

concurrency:
  group: broker-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Check Rust broker
    uses: ./.github/workflows/ci.yml

  dependency-security:
    name: Check Rust dependency policy
    uses: ./.github/workflows/dependency-security.yml

  build:
    name: Build pull-request image
    runs-on: ubuntu-latest
    needs: [test, dependency-security]
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build broker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: bjorkan/meshcore-mqtt-broker:build-${{ github.sha }}
          outputs: type=docker,dest=/tmp/broker-image.tar
          cache-from: type=gha,scope=broker-pr-amd64
          cache-to: type=gha,mode=max,scope=broker-pr-amd64

      - name: Scan pull-request image without registry credentials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: /tmp/broker-image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: sarif
          output: trivy-pr-image.sarif

      - name: Preserve pull-request vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-pr-image-${{ github.sha }}
          path: trivy-pr-image.sarif
          if-no-files-found: warn

      - name: Smoke-test the built AMD64 container
        run: |
          docker load --input /tmp/broker-image.tar
          bash .github/scripts/container-smoke.sh bjorkan/meshcore-mqtt-broker:build-${{ github.sha }} linux/amd64

  publish:
    name: Build, scan and promote image
    runs-on: ubuntu-latest
    needs: [test, dependency-security]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'Bjorkan/meshcore-mqtt-broker'
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable AMD64 image
        id: amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          # The per-arch `sha-...-amd64`/`-arm64` tags are a deliberate staging
          # exposure: they are pushed before the Scout CVE scan so the scan can
          # address an immutable digest. Only the multi-arch `sha-...`/`latest`
          # manifests are promoted after both scans pass, so the human-facing
          # tags never point at an unapproved image. Keep the final promotion
          # digest-gated and do not relax the scan exit-code.
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=broker-release-amd64
          cache-to: type=gha,mode=max,scope=broker-release-amd64
          tags: |
            bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}-amd64
            ghcr.io/bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}-amd64

      - name: Scan exact AMD64 image digest
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: bjorkan/meshcore-mqtt-broker@${{ steps.amd64.outputs.digest }}
          only-severities: critical,high
          exit-code: true
          sarif-file: scout-amd64.sarif
          summary: true
          write-comment: false
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preserve AMD64 vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scout-amd64-${{ steps.tags.outputs.short_sha }}
          path: scout-amd64.sarif
          if-no-files-found: warn

      - name: Smoke-test exact AMD64 image
        run: bash .github/scripts/container-smoke.sh bjorkan/meshcore-mqtt-broker@${{ steps.amd64.outputs.digest }} linux/amd64

      - name: Build and push immutable ARM64 image
        id: arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=broker-release-arm64
          cache-to: type=gha,mode=max,scope=broker-release-arm64
          tags: |
            bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}-arm64
            ghcr.io/bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}-arm64

      - name: Scan exact ARM64 image digest
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: bjorkan/meshcore-mqtt-broker@${{ steps.arm64.outputs.digest }}
          only-severities: critical,high
          exit-code: true
          sarif-file: scout-arm64.sarif
          summary: true
          write-comment: false
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preserve ARM64 vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scout-arm64-${{ steps.tags.outputs.short_sha }}
          path: scout-arm64.sarif
          if-no-files-found: warn

      - name: Smoke-test exact ARM64 image under QEMU
        run: bash .github/scripts/container-smoke.sh bjorkan/meshcore-mqtt-broker@${{ steps.arm64.outputs.digest }} linux/arm64

      - name: Promote scanned digests to Docker Hub manifests
        run: |
          docker buildx imagetools create \
            --tag bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }} \
            --tag bjorkan/meshcore-mqtt-broker:latest \
            bjorkan/meshcore-mqtt-broker@${{ steps.amd64.outputs.digest }} \
            bjorkan/meshcore-mqtt-broker@${{ steps.arm64.outputs.digest }}

      - name: Promote scanned digests to GHCR manifests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }} \
            --tag ghcr.io/bjorkan/meshcore-mqtt-broker:latest \
            ghcr.io/bjorkan/meshcore-mqtt-broker@${{ steps.amd64.outputs.digest }} \
            ghcr.io/bjorkan/meshcore-mqtt-broker@${{ steps.arm64.outputs.digest }}
