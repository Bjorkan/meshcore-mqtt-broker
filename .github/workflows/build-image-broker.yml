name: Build image for Broker

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - package.json
      - package-lock.json
      - .node-version
      - .dockerignore
      - tsconfig.json
      - jest.config.mjs
      - Dockerfile
      - docker-entrypoint.sh
      - config.yaml
      - compose.yaml.example
      - scripts/**
      - .github/workflows/build-image-broker.yml
      - renovate.json
      - eslint.config.mjs
      - .prettierrc
      - .prettierignore
      - .editorconfig
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check tests for Broker
    runs-on: ubuntu-latest
    # Format/lint failures stop the job immediately – build/test do
    # not run, and dependent jobs (build, publish) are skipped via needs.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate lockfile portability
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and linting
        run: npm run format:check && npm run lint

      - name: Build and run tests
        if: success()
        run: npm run test:ci

      - name: Validate Compose example
        run: docker compose -f compose.yaml.example config --quiet

      - name: Upload npm logs on failure for debugging
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs/
          if-no-files-found: ignore
          retention-days: 3

  build:
    name: Build image for Broker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build broker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: bjorkan/meshcore-mqtt-broker:build-${{ github.sha }}
          outputs: type=docker,dest=/tmp/broker-image.tar

      - name: Docker Scout broker image
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: archive:///tmp/broker-image.tar
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true
          write-comment: false
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    name: Publish image broker
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform broker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bjorkan/meshcore-mqtt-broker:latest
            bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}
            ghcr.io/bjorkan/meshcore-mqtt-broker:latest
            ghcr.io/bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}
