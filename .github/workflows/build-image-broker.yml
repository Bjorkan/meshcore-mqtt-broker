name: Build image for Broker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .dockerignore
      - Dockerfile
      - docker-entrypoint.sh
      - config.yaml
      - compose.yaml.example
      - .github/workflows/build-image-broker.yml
      - renovate.json
      - .editorconfig
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check Rust broker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets with Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run stateless test suite
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Validate Compose example
        run: docker compose -f compose.yaml.example config --quiet

      - name: Smoke-boot Rust broker and probe MQTT-over-WebSocket
        shell: bash
        run: |
          set -euo pipefail
          target/release/meshcore-mqtt-broker >/tmp/mc-mqtt-smoke-server.log 2>&1 &
          broker_pid=$!
          trap 'kill "${broker_pid}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            rm -f /tmp/mc-mqtt-smoke-headers
            curl_exit=0
            curl --silent --http1.1 --max-time 1 \
              --dump-header /tmp/mc-mqtt-smoke-headers \
              --output /dev/null \
              --header 'Connection: Upgrade' \
              --header 'Upgrade: websocket' \
              --header 'Sec-WebSocket-Version: 13' \
              --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
              --header 'Sec-WebSocket-Protocol: mqtt' \
              http://127.0.0.1:8883/ || curl_exit=$?

            if grep -q '101 Switching Protocols' /tmp/mc-mqtt-smoke-headers \
              && grep -qi '^sec-websocket-protocol: mqtt' /tmp/mc-mqtt-smoke-headers; then
              echo "smoke: Rust MQTT-over-WebSocket listener ok"
              break
            fi
            if ! kill -0 "${broker_pid}" 2>/dev/null; then
              cat /tmp/mc-mqtt-smoke-server.log
              exit 1
            fi
            if [ "${attempt}" = "20" ]; then
              echo "curl exit: ${curl_exit}"
              cat /tmp/mc-mqtt-smoke-headers || true
              cat /tmp/mc-mqtt-smoke-server.log
              exit 1
            fi
            sleep 1
          done

  build:
    name: Build image for Broker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build broker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: bjorkan/meshcore-mqtt-broker:build-${{ github.sha }}
          outputs: type=docker,dest=/tmp/broker-image.tar

      - name: Docker Scout broker image
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: archive:///tmp/broker-image.tar
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          summary: true
          write-comment: false
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    name: Publish image broker
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'Bjorkan/meshcore-mqtt-broker'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform broker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bjorkan/meshcore-mqtt-broker:latest
            bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}
            ghcr.io/bjorkan/meshcore-mqtt-broker:latest
            ghcr.io/bjorkan/meshcore-mqtt-broker:sha-${{ steps.tags.outputs.short_sha }}
