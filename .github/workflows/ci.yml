name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  postgres-functional:
    name: PostgreSQL functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17@sha256:a3c9d74fd7073603b8ecfcfb343f263342f22a1c1ce0a93f6d75c6b654a3dc37
        env:
          POSTGRES_DB: meshcore_test
          POSTGRES_USER: meshcore_test
          POSTGRES_PASSWORD: meshcore_test
        options: >-
          --health-cmd "pg_isready -U meshcore_test -d meshcore_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      POSTGRES_TEST_URL: postgresql://meshcore_test:meshcore_test@127.0.0.1:5432/meshcore_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:postgres
