name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  stateless-suite:
    name: Rust stateless suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rust-1.99.0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Check all targets with Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run stateless test suite
        run: cargo test --all-targets --locked

      - name: Run Rust documentation tests
        run: cargo test --doc --locked

      - name: Build release binary
        run: cargo build --release --locked
