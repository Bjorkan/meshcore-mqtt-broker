name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  postgres-functional:
    name: PostgreSQL functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: meshcore_test
          POSTGRES_USER: meshcore_test
          POSTGRES_PASSWORD: meshcore_test
        options: >-
          --health-cmd "pg_isready -U meshcore_test -d meshcore_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      POSTGRES_TEST_URL: postgresql://meshcore_test:meshcore_test@127.0.0.1:5432/meshcore_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:postgres
