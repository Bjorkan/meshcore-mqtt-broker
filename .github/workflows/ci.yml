name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  stateless-suite:
    name: Stateless suite (format + lint + typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - name: Format + lint + typecheck
        run: bun run check
      - name: Stateless test suite (no database)
        run: bun test
