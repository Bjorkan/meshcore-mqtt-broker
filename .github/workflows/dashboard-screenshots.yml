name: Dashboard screenshots

on:
  pull_request:
    paths:
      - src/**
      - dashboard/**
      - tests/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - jest.config.mjs
      - scripts/**
      - .github/workflows/dashboard-screenshots.yml

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  screenshots:
    name: Capture dashboard screenshots
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: http://127.0.0.1:8080
      DASHBOARD_SCREENSHOT_DIR: dashboard-screenshots
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate lockfile portability
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build broker and dashboard
        run: npm run build

      - name: Write dashboard review config
        run: |
          cat > config.yaml <<'YAML'
          mqtt:
            ws_port: 8883
            host: 127.0.0.1
            ws_max_payload_bytes: 65536
            json_publish_max_bytes: 8192

          dashboard:
            port: 8080

          broker:
            name: ReviewBroker
            runtime_id_file: /tmp/dashboard-review-instance-id
            node_name_cache_ttl_ms: 86400000

          target_mqtt:
            url: ""
            username: ""
            password: ""
            reject_unauthorized: true
            reconnect_period_ms: 5000
            connect_timeout_ms: 30000

          proxy:
            trust_proxy: false
            trusted_proxy_cidrs: ""

          auth:
            expected_audience: mqtt.visual-review.example

          subscribers:
            default_max_connections: 2
            users:
              - username: visual-review
                password: visual-review
                role: 2

          healthcheck:
            mqtt_timeout_ms: 10000
            mqtt_keepalive_seconds: 60

          meshcore_io:
            enabled: true
            api_url: https://map.meshcore.io/api/v1/uploader/node
            dry_run: true
            min_reupload_seconds: 3600
            request_timeout_ms: 10000
            workers: 1
            max_queued_uploads: 250
            attempts: 3
            retry_delay_ms: 5000
            ingress_dedup_ms: 10000

          abuse:
            enforcement_enabled: false
            duplicate_window_size: 100
            duplicate_window_ms: 300000
            duplicate_threshold: 10
            max_duplicates_per_packet: 5
            duplicate_rate_threshold: 0.3
            duplicate_rate_window_ms: 300000
            bucket_capacity: 20
            bucket_refill_rate: 3
            max_packet_size: 255
            max_topics_per_day: 3
            anomaly_threshold: 10
            max_iata_changes_24h: 3
            topic_history_size: 50
            topic_history_window_ms: 86400000

          allowed_regions:
            STO:
              friendly_name: Stockholmsområdet
            GOT:
              friendly_name: Göteborg och Västra Götaland
            JKG:
              friendly_name: Jönköping och södra Vätternområdet
            MMX:
              friendly_name: Malmö och södra Skåne
          YAML

      - name: Create database directory
        run: |
          sudo mkdir -p /data/meshcore-mqtt-broker
          sudo chown "$(id -un):$(id -gn)" /data/meshcore-mqtt-broker

      - name: Seed demo data
        run: |
          mkdir -p "$(dirname /tmp/dashboard-review-instance-id)"
          echo 'ReviewBroker' > /tmp/dashboard-review-instance-id
          npm run dashboard:seed-demo
        env:
          BROKER_RUNTIME_ID_FILE: /tmp/dashboard-review-instance-id

      - name: Start broker and capture screenshots
        shell: bash
        run: |
          set -x
          mkdir -p dashboard-screenshots
          node dist/server.js > dashboard-server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID"
          cleanup() {
            if [ -n "${SUBSCRIBER_PID:-}" ]; then
              kill "${SUBSCRIBER_PID}" 2>/dev/null || true
            fi
            if [ -n "${SERVER_PID:-}" ]; then
              kill "${SERVER_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${DASHBOARD_URL}/api/dashboard" > /tmp/dashboard.json; then
              echo "Dashboard API responding after ${attempt}s"
              node scripts/connect-dashboard-subscriber.mjs &
              SUBSCRIBER_PID=$!
              for sub_attempt in $(seq 1 30); do
                curl --fail --silent "${DASHBOARD_URL}/api/dashboard" > /tmp/dashboard.json
                if jq -e '
                  (.subscribers | any(.username == "visual-review")) and
                  (.bans | length >= 3) and
                  (.meshcoreIo.map.advertsLast7Days | length >= 6)
                ' /tmp/dashboard.json >/dev/null; then
                  echo "Dashboard review data ready after ${sub_attempt}s"
                  break
                fi
                if ! kill -0 "$SUBSCRIBER_PID" 2>/dev/null; then
                  echo "Subscriber process exited unexpectedly"
                  exit 1
                fi
                sleep 1
              done
              if ! jq -e '
                (.subscribers | any(.username == "visual-review"))
              ' /tmp/dashboard.json >/dev/null; then
                echo "Dashboard review data never became ready"
                exit 1
              fi
              npm run dashboard:screenshots
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server died unexpectedly. Log:"
              cat dashboard-server.log
              exit 1
            fi
            sleep 1
          done
          echo "Server did not start within 60s. Log:"
          cat dashboard-server.log
          exit 1
        timeout-minutes: 4

      - name: Package screenshots
        if: always()
        run: |
          mkdir -p dashboard-screenshots
          if [ -f /tmp/dashboard.json ]; then
            cp /tmp/dashboard.json dashboard-screenshots/dashboard-api.json
          fi
          if [ -f dashboard-server.log ]; then
            cp dashboard-server.log dashboard-screenshots/dashboard-server.log
          fi
          find dashboard-screenshots -type f -name '*.png' | sort > dashboard-screenshots/files.txt || true
          zip -r dashboard-screenshots.zip dashboard-screenshots || true

      - name: Upload screenshot artifact
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dashboard-screenshots
          path: |
            dashboard-screenshots
            dashboard-screenshots.zip
            dashboard-server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Comment screenshots on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = '<!-- dashboard-screenshots-report -->';
            const artifactUrl = '${{ steps.upload.outputs.artifact-url }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}
            ## Dashboard screenshots

            Visual review screenshots from a live dashboard seeded with demo Turso data.

            Covers: all views (desktop + mobile), dark mode, sort states, responsive breakpoints (320–1280px), map interaction, dialog states, and overflow integrity checks.

            Artifact: [dashboard-screenshots.zip](${artifactUrl})
            Workflow run: [${context.runId}](${runUrl})

            See the artifact for all captured screenshots.
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const botComments = comments.filter((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            for (const old of botComments.slice(1)) {
              try {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: old.id });
              } catch {
                // ignore delete failures
              }
            }
            const existing = botComments[0];
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
