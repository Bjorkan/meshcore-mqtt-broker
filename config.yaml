# MeshCore MQTT Broker runtime configuration
#
# This file is read-only at runtime and is normally bind-mounted at
# /run/configs/meshcore-mqtt-broker-config.yaml.

mqtt:
  ws_port: 8883
  host: 0.0.0.0
  ws_max_payload_bytes: 65536
  json_publish_max_bytes: 8192

branding:
  operator_name: MeshCore MQTT
  dashboard_title: MeshCore MQTT Broker
  dashboard_subtitle: Operations dashboard
  website_url: ""

broker:
  name: Broker
  node_name_cache_ttl_ms: 86400000

storage:
  retention_days: 30
  cleanup_interval_minutes: 60
  cleanup_batch_size: 1000
  store_internal: false
  store_serial: false

mcp:
  enabled: true
  path: /mcp/v2
  default_limit: 50
  max_limit: 250

target_mqtt:
  url: ""
  username: ""
  password: ""
  reject_unauthorized: true
  reconnect_period_ms: 5000
  connect_timeout_ms: 30000

meshcore_io:
  # Opt-in: set to true after verifying that this broker should publish
  # verified repeater/room/sensor adverts to the public Meshcore.io map.
  enabled: false
  api_url: https://map.meshcore.io/api/v1/uploader/node
  dry_run: false
  min_reupload_seconds: 3600
  request_timeout_ms: 10000
  workers: 1
  max_queued_uploads: 250
  attempts: 3
  retry_delay_ms: 5000
  ingress_dedup_ms: 10000

proxy:
  trust_proxy: false
  trusted_proxy_cidrs: ""

auth:
  expected_audience: mqtt.yourdomain.com

subscribers:
  default_max_connections: 2
  # Add accounts before exposing the service. Example:
  # users:
  #   - username: admin
  #     password: replace-with-a-long-random-password
  #     role: 1
  #     max_connections: 10
  users: []

healthcheck:
  mqtt_timeout_ms: 10000
  mqtt_keepalive_seconds: 60

abuse:
  enforcement_enabled: false
  duplicate_window_size: 100
  duplicate_window_ms: 300000
  # Compatibility setting: parsed but not currently enforced.
  duplicate_threshold: 10
  max_duplicates_per_packet: 5
  duplicate_rate_threshold: 0.3
  duplicate_rate_window_ms: 300000
  bucket_capacity: 20
  bucket_refill_rate: 3
  max_packet_size: 255
  # Compatibility setting: parsed but not currently enforced.
  max_topics_per_day: 3
  anomaly_threshold: 10
  # Observation/logging threshold only; never denies or mutes by itself.
  max_iata_changes_24h: 3
  # Compatibility settings: parsed but not currently enforced.
  topic_history_size: 50
  topic_history_window_ms: 86400000

IATA_whitelist: false

# Inactive while IATA_whitelist is false. This Swedish operator-ready mapping
